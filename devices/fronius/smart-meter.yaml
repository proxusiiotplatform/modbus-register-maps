connection:
  interfaces: [tcp, rtu]
  default_byte_order: ABCD
  notes:
    - SunSpec map with float values; set the device's SunSpec model type to "float" (the "int+SF" setting uses a different map).
    - Addresses are Fronius register numbers minus one; the SunSpec marker 'SunS' is at address 40000.
    - The inverter serves the meter under its own unit id; see the Fronius Modbus TCP & RTU manual.
