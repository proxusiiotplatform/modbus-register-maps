# Transcribed from Siemens' manual; not yet checked against a device.
schema_version: 1
vendor: Siemens
model: PAC3200
aliases: [SENTRON PAC3200, 7KM2112-0BA00-3AA0, 7KM2111-1BA00-3AA0]
category: power-analyzer
summary: SENTRON PAC3200 power monitoring device; measurements are 32-bit floats, energy counters 64-bit floats.
connection:
  interfaces: [tcp, rtu]
  default_byte_order: ABCD
  notes:
    - Addresses are the manual's offsets, sent unchanged (the convention mbmd's working PAC2200 driver uses).
    - Function code 3 or 4 reads the same registers; reading from the middle of a multi-register value is refused.
    - Modbus TCP is built in; Modbus RTU needs the PAC RS485 expansion module.
    - Read the identification block (64001, 27 registers) in a single request.
sources:
  - title: SENTRON PAC3200 Power Monitoring Device Manual
    publisher: Siemens
    document_id: A5E01168664B-04
    url: https://support.industry.siemens.com/cs/ww/en/view/26504150
    accessed: 2026-10-31
    sha256: b9efef1f28f8588d3f9b9ba04754e4914850fb0ec74373955d199d8f6b3de187
    notes: Section 3.9, tables 3-6 (measured variables), 3-11 (settings) and 3-23 (I&M 0).
