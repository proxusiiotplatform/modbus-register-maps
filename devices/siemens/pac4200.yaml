# Transcribed from Siemens' system manual; not yet checked against a device.
schema_version: 1
vendor: Siemens
model: PAC4200
aliases: [SENTRON PAC4200, 7KM4212-0BA00-3AA0, 7KM4211-1BA00-3AA0]
category: power-analyzer
summary: SENTRON PAC4200 power monitoring device; measurements are 32-bit floats, energy counters 64-bit floats.
connection:
  interfaces: [tcp, rtu]
  default_byte_order: ABCD
  notes:
    - Addresses are the manual's offsets, sent unchanged (the convention mbmd's working PAC2200 driver uses).
    - Function code 3 or 4 reads the same registers; reading from the middle of a multi-register value is refused.
    - Modbus TCP is built in; Modbus RTU needs the PAC RS485 expansion module.
    - Measured variables with a time stamp, minimum/maximum logs and the configuration settings are not in this map yet.
sources:
  - title: SENTRON PAC4200 Power Monitoring Device System Manual
    publisher: Siemens
    document_id: A5E02316180B-05
    version: 05/2019
    url: https://support.industry.siemens.com/cs/ww/en/view/34261595
    accessed: 2026-10-31
    sha256: fafd49af4745c2fc24d78b0a9a7d09a1a3746f7d9d7ade94baee1d5a9a247276
    notes: Appendix A, tables A-1, A-2 (measured variables) and A-12 to A-16 (tariff-specific energy).
