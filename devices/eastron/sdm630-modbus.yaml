# Transcribed from Eastron's protocol document; not yet checked against a meter.
schema_version: 1
vendor: Eastron
model: SDM630-Modbus
aliases: [SDM630, SDM630 V2, SDM630Modbus]
category: energy-meter
summary: Three-phase DIN-rail energy meter with RS485 Modbus RTU; every value is a 32-bit float.
connection:
  interfaces: [rtu]
  default_unit_id: 1
  default_byte_order: ABCD
  max_registers_per_read: 80
  serial_defaults: 9600 baud, 8 data bits, no parity, 1 stop bit
  notes:
    - Read and write registers in pairs; an odd start address or count returns an exception.
    - Up to 40 values (80 registers) per request.
    - Float word order can be reversed through the meter's register order setting; ABCD is the default.
    - Parameters marked for other wiring modes read as zero.
wiring_modes: [3P4W, 3P3W, 1P2W]
sources:
  - title: Eastron SDM630Modbus Smart Meter Modbus Protocol Implementation
    publisher: Eastron
    version: V1.8
    url: https://communityarchive.victronenergy.com/storage/attachments/sdm630-modbus-protocol.pdf
    accessed: 2026-10-31
    sha256: 3968e14300023271c4dcd1acf450b8a1bc06cf961b2231d2b448e8e8c1fc57ee
    notes: Copy hosted by the Victron community archive; Eastron publishes no copy that can be downloaded without a request.
