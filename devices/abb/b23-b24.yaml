# Transcribed from ABB's user manual (revision E); not yet checked against a meter.
schema_version: 1
vendor: ABB
model: B23/B24
aliases: [ABB B23, ABB B24, B23 112-100, B23 312-100, B24 112-100, B24 312-100]
category: energy-meter
summary: ABB B23 (direct connected) and B24 (transformer connected) DIN-rail energy meters with Modbus RTU; integers with fixed resolution.
connection:
  interfaces: [rtu]
  default_byte_order: ABCD
  max_registers_per_read: 125
  notes:
    - Addresses are sent exactly as the manual lists them in hex; nothing is subtracted.
    - Every register here is a holding register (function code 3); writes use function code 6 or 16.
    - Missing quantities read as invalid, FFFF for unsigned and 7FFF... for signed values.
    - Only the Modbus RTU versions of the meter answer Modbus; M-Bus versions use a different protocol.
sources:
  - title: B23/B24 User Manual
    publisher: ABB
    document_id: 2CMC485003M0201
    version: Revision E
    url: https://library.abb.com/d/2CMC485003M0201
    accessed: 2026-10-31
    sha256: 84e7a340ae82f9765c257508e74ed976d96d93ec677ac888c9623f52310e5f88
    notes: Chapter 9, Communication with Modbus.
