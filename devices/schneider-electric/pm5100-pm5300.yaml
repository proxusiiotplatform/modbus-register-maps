# Generated by tools/importers/schneider_powerlogic.py from Schneider's register list; not yet checked against a meter.
schema_version: 1
vendor: Schneider Electric
model: PM5100/PM5300
aliases: [PowerLogic PM5100, PowerLogic PM5300, PM5110, PM5111, PM5310, PM5320, PM5330, PM5331, PM5340, PM5341]
category: power-analyzer
summary: PowerLogic PM5100 and PM5300 power meters; measurements are 32-bit floats, energies also as 64-bit integers.
connection:
  interfaces: [rtu, tcp]
  default_unit_id: 1
  default_byte_order: ABCD
  notes:
    - Every register here is a holding register (function code 3).
    - Addresses are Schneider's register numbers minus one.
    - Modbus TCP only on the Ethernet models (PM5320, PM5340, PM5341).
    - Unavailable values read as the N/A pattern of their type, e.g. 0xFFC00000 for FLOAT32.
