model: ATV900
aliases: [Altivar Process ATV900, ATV930, ATV950, ATV960, ATV980, ATV9A0]
category: vfd
summary: Altivar Process ATV900 drives (ATV930, ATV950...); every parameter is a 16-bit holding register at its logic address.
connection:
  interfaces: [rtu, tcp]
  default_byte_order: ABCD
  serial_defaults: 19200 baud, 8 data bits, even parity, 1 stop bit
  notes:
    - The embedded Modbus serial address is OFF from the factory; set [Modbus Address] (Add) before connecting.
    - Parameter codes (ETA, CMD, LFR...) are in each register's notes; the drive's display uses the same codes.
    - Writing CMD or setpoints moves the motor. Read-only access is the safe default.
