# Generated by tools/importers/schneider_altivar.py from Schneider's parameter workbook; not yet checked against a drive.
schema_version: 1
vendor: Schneider Electric
model: ATV340
aliases: [Altivar Machine ATV340, ATV340U, ATV340D]
category: vfd
summary: Altivar Machine ATV340 drive; every parameter is a 16-bit holding register at its logic address.
connection:
  interfaces: [rtu, tcp]
  default_byte_order: ABCD
  notes:
    - Logic addresses are sent unchanged, the convention of Schneider's ATV320 and ATV900 Modbus manuals; not yet confirmed in an ATV340 manual.
    - Parameter codes (ETA, CMD, LFR...) are in each register's notes; the drive's display uses the same codes.
    - Writing CMD or setpoints moves the motor. Read-only access is the safe default.
