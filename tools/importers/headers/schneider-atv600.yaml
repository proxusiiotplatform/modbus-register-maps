# Generated by tools/importers/schneider_altivar.py from Schneider's parameter workbook; not yet checked against a drive.
schema_version: 1
vendor: Schneider Electric
model: ATV600
aliases: [Altivar Process ATV600, ATV610, ATV630, ATV650, ATV660, ATV680]
category: vfd
summary: Altivar Process ATV600 drives (ATV630, ATV650...); every parameter is a 16-bit holding register at its logic address.
connection:
  interfaces: [rtu, tcp]
  default_byte_order: ABCD
  notes:
    - Logic addresses are sent unchanged, the convention of Schneider's ATV320 and ATV900 Modbus manuals; not yet confirmed in an ATV600 manual.
    - Parameter codes (ETA, CMD, LFR...) are in each register's notes; the drive's display uses the same codes.
    - Writing CMD or setpoints moves the motor. Read-only access is the safe default.
