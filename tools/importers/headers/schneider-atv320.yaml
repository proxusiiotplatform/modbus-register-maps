# Generated by tools/importers/schneider_altivar.py from Schneider's parameter workbook; not yet checked against a drive.
schema_version: 1
vendor: Schneider Electric
model: ATV320
aliases: [Altivar Machine ATV320, ATV320U, ATV320D]
category: vfd
summary: Altivar Machine ATV320 variable speed drive; every parameter is a 16-bit holding register at its logic address.
connection:
  interfaces: [rtu, tcp]
  default_byte_order: ABCD
  serial_defaults: 19200 baud, 8 data bits, even parity, 1 stop bit
  notes:
    - The Modbus address of the drive is OFF from the factory; set [Modbus Address] (Add) before connecting.
    - Modbus TCP needs an Ethernet communication module.
    - Parameter codes (ETA, CMD, LFR...) are in each register's notes; the drive's display uses the same codes.
    - Writing CMD or setpoints moves the motor. Read-only access is the safe default.
